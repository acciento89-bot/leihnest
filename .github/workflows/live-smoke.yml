name: Live smoke

on:
  push:
    branches:
      - ops/live-smoke-20260919

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if body="$(curl -fsS --connect-timeout 10 --max-time 20 https://leihnest.de/api/health)"; then
              echo "$body"
              grep -q '"status":"ok"' <<<"$body"
              grep -q '"service":"leihnest"' <<<"$body"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "health endpoint did not become reachable" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify homepage pricing and feature links
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 https://leihnest.de/)"
          grep -q 'href="/preise"' <<<"$body"
          grep -q 'LeihNest Plus' <<<"$body"
          grep -q '4,99' <<<"$body"
          grep -q '39,99' <<<"$body"
          grep -q 'href="/funktionen#inventar"' <<<"$body"
          grep -q 'href="/funktionen#reservierungen"' <<<"$body"
          grep -q 'href="/funktionen#rueckgaben"' <<<"$body"

      - name: Verify German pricing page
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 https://leihnest.de/preise)"
          grep -q 'Plus ist optional' <<<"$body"
          grep -q 'Dauerhaft kostenlos' <<<"$body"
          grep -q '4,99' <<<"$body"
          grep -q '39,99' <<<"$body"
          grep -q 'Ein Abo gilt für die ganze Gruppe' <<<"$body"

      - name: Verify German feature details
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 https://leihnest.de/funktionen)"
          grep -q 'id="inventar"' <<<"$body"
          grep -q 'id="reservierungen"' <<<"$body"
          grep -q 'id="rueckgaben"' <<<"$body"
          grep -q 'Inventar organisieren' <<<"$body"
          grep -q 'Smarte Reservierungen' <<<"$body"
          grep -q 'Rückgaben im Blick' <<<"$body"

      - name: Verify English public pages
        shell: bash
        run: |
          set -euo pipefail
          pricing="$(curl -fsSL --connect-timeout 10 --max-time 20 https://leihnest.de/en/pricing)"
          features="$(curl -fsSL --connect-timeout 10 --max-time 20 https://leihnest.de/en/features)"
          grep -q 'Plus is optional' <<<"$pricing"
          grep -q '€4.99' <<<"$pricing"
          grep -q '€39.99' <<<"$pricing"
          grep -q 'id="inventory"' <<<"$features"
          grep -q 'id="reservations"' <<<"$features"
          grep -q 'id="returns"' <<<"$features"

      - name: Verify Stripe webhook route exists
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/webhook-response -w '%{http_code}' --connect-timeout 10 --max-time 20             -X POST -H 'Content-Type: application/json' --data '{}'             https://leihnest.de/api/stripe/webhook)"
          echo "webhook HTTP $code"
          test "$code" = "400"

      - name: Verify login surface
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/login -w '%{http_code}' --connect-timeout 10 --max-time 20 https://leihnest.de/login)"
          echo "login HTTP $code"
          test "$code" = "200"
