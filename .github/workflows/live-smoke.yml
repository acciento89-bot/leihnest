name: Live smoke

on:
  push:
    branches:
      - ops/live-smoke-20260919

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if body="$(curl -fsS --connect-timeout 10 --max-time 20 https://leihnest.de/api/health)"; then
              echo "$body"
              grep -q '"status":"ok"' <<<"$body"
              grep -q '"service":"leihnest"' <<<"$body"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "health endpoint did not become reachable" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify deployed release markers
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 https://leihnest.de/datenschutz)"
          grep -q 'Gegenstandsbilder' <<<"$body"
          grep -q 'Stripe' <<<"$body"
          grep -q '19. September 2026' <<<"$body"

      - name: Verify Stripe webhook route exists
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/webhook-response -w '%{http_code}' --connect-timeout 10 --max-time 20             -X POST -H 'Content-Type: application/json' --data '{}'             https://leihnest.de/api/stripe/webhook)"
          echo "webhook HTTP $code"
          test "$code" = "400"

      - name: Verify login surface
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/login -w '%{http_code}' --connect-timeout 10 --max-time 20 https://leihnest.de/login)"
          echo "login HTTP $code"
          test "$code" = "200"
