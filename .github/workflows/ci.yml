name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: build-only-secret-build-only-secret-1234
      BETTER_AUTH_URL: http://localhost:3000
      SECRET_KEY: legacy-portainer-build-secret-1234567890
      PUBLIC_URL: https://leihnest.de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare offline verification workspace
        if: github.ref == 'refs/heads/feat/member-experience-20260918'
        run: |
          npm run db:generate
          tar --exclude=.git --exclude=.next --exclude=.env --exclude=.env.local -czf /tmp/leihnest-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feat/member-experience-20260918'
        with:
          name: leihnest-offline-workspace
          path: /tmp/leihnest-workspace.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Report dependency audit
        run: npm audit --omit=dev || true
      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: cmp compose.portainer.yaml docker-compose.portainer.yml
      - run: docker compose -f compose.portainer.yaml config
      - run: docker build -t leihnest:ci .
