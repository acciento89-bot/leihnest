name: LeihNest checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: leihnest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Desktop, mobile and full browser lifecycle
        run: python tests/browser_check.py
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag leihnest:ci .
      - name: Verify non-root container and database health
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(openssl rand -hex 32)
          docker run -d --name leihnest-ci --env SECRET_KEY="$KEY" --env PUBLIC_URL=https://leihnest.de leihnest:ci
          trap 'docker logs leihnest-ci; docker rm -f leihnest-ci' EXIT
          for i in $(seq 1 30); do
            if docker exec leihnest-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"; then
              test "$(docker exec leihnest-ci id -u)" = "10001"
              exit 0
            fi
            sleep 2
          done
          exit 1
