name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: build-only-secret-build-only-secret-1234
      BETTER_AUTH_URL: http://localhost:3000
      POSTGRES_PASSWORD: build-only-postgres-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: docker compose -f docker-compose.portainer.yml config
      - run: docker build -t leihnest:ci .
