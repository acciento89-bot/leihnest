name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leihnest_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: leihnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leihnest_test -d leihnest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEIHNEST_TEST_DATABASE_URL: postgresql://leihnest_test@localhost:5432/leihnest_test
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: build-only-secret-build-only-secret-1234
      BETTER_AUTH_URL: http://localhost:3000
      SECRET_KEY: legacy-portainer-build-secret-1234567890
      PUBLIC_URL: https://leihnest.de
      UPLOADS_DIR: /tmp/leihnest-uploads
      STRIPE_SECRET_KEY: sk_test_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      STRIPE_PLUS_MONTHLY_PRICE_ID: price_ci_month
      STRIPE_PLUS_YEARLY_PRICE_ID: price_ci_year
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Report dependency audit
        run: npm audit --omit=dev || true
      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: cmp compose.portainer.yaml docker-compose.portainer.yml
      - run: docker compose -f compose.portainer.yaml config
      - run: docker build -t leihnest:ci .
