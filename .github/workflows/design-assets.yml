name: Design photo preparation
on:
  push:
    branches: [design/concept-fidelity-20260919]
    paths: [.github/workflows/design-assets.yml]
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download public product photographs
        run: |
          mkdir -p photos
          curl --fail --location --retry 1 --max-time 30 --user-agent 'LeihNest design review' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Optoma_HD65_-_Front.jpg' -o photos/projector-optoma.jpg
          curl --fail --location --retry 1 --max-time 30 --user-agent 'LeihNest design review' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gereedschapskist_van_bouwvakker%2C_objectnr_91208-1.JPG' -o photos/toolbox-studio.jpg
          file photos/*
      - uses: actions/upload-artifact@v4
        with:
          name: leihnest-final-product-photos
          path: photos/
          retention-days: 2
