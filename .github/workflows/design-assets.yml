name: Design photo preparation
on:
  push:
    branches: [design/concept-fidelity-20260919]
    paths: [.github/workflows/design-assets.yml]
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download public reference photographs
        run: |
          mkdir -p photos
          for pair in 'projector-front|EPSON_CH-TW5400_LCD_PROJECTOR.jpg' 'projector-studio|Epson_H428B-7405.jpg' 'toolbox-alternative|Toolbox_(6788494881).jpg'; do
            name=${pair%%|*}
            file=${pair#*|}
            curl --fail --location --retry 1 --max-time 30 --user-agent 'LeihNest design review' "https://commons.wikimedia.org/wiki/Special:Redirect/file/$file" -o "photos/$name.jpg" || true
          done
          file photos/*
      - uses: actions/upload-artifact@v4
        with:
          name: leihnest-licensed-photos-front
          path: photos/
          retention-days: 2
