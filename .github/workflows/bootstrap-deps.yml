name: Bootstrap media billing dependencies

on:
  push:
    paths:
      - .github/workflows/bootstrap-deps.yml

permissions:
  contents: write

# Temporary bootstrap; removed after lockfile update.

jobs:
  lock:
    if: github.ref == 'refs/heads/feat/release-ready-media-billing-20260919'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-ready-media-billing-20260919
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install sharp stripe --save
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: add media and Stripe runtime dependencies"
          git fetch origin feat/release-ready-media-billing-20260919
          git rebase origin/feat/release-ready-media-billing-20260919
          git push origin HEAD:feat/release-ready-media-billing-20260919
